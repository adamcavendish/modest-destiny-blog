<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Three DPoP verification gates</title><desc id="desc">A DPoP request is checked for key binding, request binding, and freshness and replay before it is allowed.</desc>
<rect width="1200" height="430" fill="#fafaf8"/>
<g font-family="Arial,sans-serif" fill="#242424"><text x="60" y="60" font-size="26" font-weight="700">three questions before the request enters</text>
<path d="M140 225H210M410 225H480M680 225H750M950 225H1030" stroke="#9f3d42" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="155" width="100" height="140" rx="14" fill="#242629"/><text x="90" y="215" text-anchor="middle" font-size="18" fill="#f2f0ec">proof</text><text x="90" y="245" text-anchor="middle" font-size="18" fill="#e58a8d">token</text>
<rect x="215" y="130" width="195" height="190" rx="14" fill="#f1eee8" stroke="#6c8bb3" stroke-width="4"/><text x="312" y="177" text-anchor="middle" font-size="18" font-weight="700">1 · key</text><text x="312" y="216" text-anchor="middle" font-size="15">signature valid?</text><text x="312" y="247" text-anchor="middle" font-size="15">cnf.jkt matches?</text><text x="312" y="286" text-anchor="middle" font-size="16" fill="#6c8bb3">cryptographic</text>
<rect x="485" y="130" width="195" height="190" rx="14" fill="#f1eee8" stroke="#6c8bb3" stroke-width="4"/><text x="582" y="177" text-anchor="middle" font-size="18" font-weight="700">2 · request</text><text x="582" y="216" text-anchor="middle" font-size="15">htm and htu?</text><text x="582" y="247" text-anchor="middle" font-size="15">ath matches?</text><text x="582" y="286" text-anchor="middle" font-size="16" fill="#6c8bb3">contextual</text>
<rect x="755" y="130" width="195" height="190" rx="14" fill="#f1eee8" stroke="#6c8bb3" stroke-width="4"/><text x="852" y="177" text-anchor="middle" font-size="18" font-weight="700">3 · time</text><text x="852" y="216" text-anchor="middle" font-size="15">iat is fresh?</text><text x="852" y="247" text-anchor="middle" font-size="15">jti unused?</text><text x="852" y="286" text-anchor="middle" font-size="16" fill="#6c8bb3">replay-safe</text>
<rect x="1035" y="172" width="125" height="106" rx="14" fill="#9f3d42"/><text x="1097" y="218" text-anchor="middle" font-size="19" fill="#fff">allow</text><text x="1097" y="247" text-anchor="middle" font-size="16" fill="#fff">or reject</text>
</g><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#9f3d42"/></marker></defs></svg>
