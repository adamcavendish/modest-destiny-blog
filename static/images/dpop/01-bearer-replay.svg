<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">A bearer token replay</title><desc id="desc">A client sends a bearer token through a gateway to an API, while an observer copies the token and replays it.</desc>
<rect width="1200" height="430" fill="#fafaf8"/>
<g font-family="Arial,sans-serif" fill="#242424">
<text x="60" y="60" font-size="26" font-weight="700">the copied request looks like the original</text>
<text x="60" y="94" font-size="17" fill="#66635f">the API sees a valid token, not the history of its journey</text>
<rect x="60" y="160" width="150" height="104" rx="14" fill="#f1eee8" stroke="#9f3d42" stroke-width="4"/><text x="135" y="219" text-anchor="middle" font-size="21">client</text>
<rect x="350" y="160" width="180" height="104" rx="14" fill="#f1eee8" stroke="#66635f" stroke-width="3"/><text x="440" y="219" text-anchor="middle" font-size="21">gateway</text>
<rect x="870" y="160" width="170" height="104" rx="14" fill="#f1eee8" stroke="#9f3d42" stroke-width="4"/><text x="955" y="219" text-anchor="middle" font-size="21">API</text>
<path d="M220 212H335M545 212H855" stroke="#242424" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<rect x="575" y="173" width="220" height="78" rx="10" fill="#242629"/><text x="685" y="205" text-anchor="middle" font-size="15" fill="#f2f0ec">Authorization: Bearer</text><text x="685" y="230" text-anchor="middle" font-size="15" fill="#e58a8d">eyJhbGciOi...</text>
<path d="M685 252V326" stroke="#9f3d42" stroke-width="4" stroke-dasharray="8 8"/>
<circle cx="685" cy="354" r="27" fill="#9f3d42"/><text x="685" y="362" text-anchor="middle" font-size="23" fill="#fff">?</text>
<path d="M715 354H855" stroke="#9f3d42" stroke-width="5" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)"/>
<text x="60" y="365" font-size="18" fill="#9f3d42">observer</text><text x="60" y="392" font-size="16" fill="#66635f">a copied string is still a bearer credential</text>
</g><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#242424"/></marker></defs></svg>
