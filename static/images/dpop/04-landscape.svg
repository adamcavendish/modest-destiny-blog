<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">A landscape of sender constrained tokens</title><desc id="desc">DPoP and mTLS occupy different points on the axes of deployment reach and operational weight, while bearer tokens and custom signatures represent other tradeoffs.</desc>
<rect width="1200" height="520" fill="#fafaf8"/><g font-family="Arial,sans-serif" fill="#242424"><text x="60" y="58" font-size="26" font-weight="700">the industrial neighborhood</text><text x="60" y="88" font-size="17" fill="#66635f">every alternative moves a different boundary</text>
<path d="M170 430V130M170 430H1040" stroke="#242424" stroke-width="3"/><text x="1050" y="438" font-size="16" fill="#66635f">operational weight →</text><text x="100" y="145" transform="rotate(-90 100 145)" font-size="16" fill="#66635f">sender constraint →</text>
<circle cx="310" cy="360" r="18" fill="#999"/><text x="342" y="366" font-size="18">bearer token</text><text x="342" y="389" font-size="14" fill="#66635f">widest reach, weakest binding</text>
<circle cx="570" cy="250" r="22" fill="#6c8bb3"/><text x="608" y="256" font-size="18">DPoP</text><text x="608" y="279" font-size="14" fill="#66635f">application-layer proof</text>
<circle cx="845" cy="168" r="22" fill="#9f3d42"/><text x="882" y="174" font-size="18">mTLS</text><text x="882" y="197" font-size="14" fill="#66635f">strong channel binding</text>
<circle cx="770" cy="340" r="18" fill="#b58b58"/><text x="802" y="346" font-size="18">custom signing</text><text x="802" y="369" font-size="14" fill="#66635f">flexible, uneven interoperability</text>
<path d="M310 360L570 250L845 168" stroke="#d8d2ca" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
</g></svg>
