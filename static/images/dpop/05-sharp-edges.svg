<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Operational sharp edges in a DPoP request</title><desc id="desc">A request passes through key storage, a proxy, a clock, and a replay cache, each of which can introduce a failure.</desc>
<rect width="1200" height="460" fill="#fafaf8"/><g font-family="Arial,sans-serif" fill="#242424"><text x="60" y="60" font-size="26" font-weight="700">the proof crosses more than one boundary</text><text x="60" y="92" font-size="17" fill="#66635f">cryptography is only one part of the operating system</text>
<path d="M125 240H260M395 240H530M665 240H800M935 240H1080" stroke="#242424" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="175" width="150" height="130" rx="14" fill="#f1eee8" stroke="#6c8bb3" stroke-width="4"/><text x="125" y="220" text-anchor="middle" font-size="18">key store</text><text x="125" y="252" text-anchor="middle" font-size="15" fill="#66635f">rotation?</text>
<rect x="270" y="175" width="150" height="130" rx="14" fill="#f1eee8" stroke="#9f3d42" stroke-width="4"/><text x="345" y="220" text-anchor="middle" font-size="18">redirect</text><text x="345" y="252" text-anchor="middle" font-size="15" fill="#66635f">new URL?</text>
<rect x="490" y="175" width="150" height="130" rx="14" fill="#f1eee8" stroke="#9f3d42" stroke-width="4"/><text x="565" y="220" text-anchor="middle" font-size="18">proxy</text><text x="565" y="252" text-anchor="middle" font-size="15" fill="#66635f">normalized URI?</text>
<rect x="710" y="175" width="150" height="130" rx="14" fill="#f1eee8" stroke="#b58b58" stroke-width="4"/><text x="785" y="220" text-anchor="middle" font-size="18">clock</text><text x="785" y="252" text-anchor="middle" font-size="15" fill="#66635f">skew?</text>
<rect x="930" y="175" width="190" height="130" rx="14" fill="#f1eee8" stroke="#9f3d42" stroke-width="4"/><text x="1025" y="220" text-anchor="middle" font-size="18">replay cache</text><text x="1025" y="252" text-anchor="middle" font-size="15" fill="#66635f">shared state?</text>
<text x="60" y="382" font-size="17" fill="#9f3d42">a valid signature can still arrive at the wrong boundary</text>
</g><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#242424"/></marker></defs></svg>
